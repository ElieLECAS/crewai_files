version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_server
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=documents_db
    restart: unless-stopped

  pdf_processor:
    build: .
    container_name: pdf_processor
    depends_on:
      - mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PYTHONPATH=/app
      - MODEL=${MODEL:-llama3.2:3b}
      - MODEL_EXTRACT=${MODEL_EXTRACT:-${MODEL}}
      - EXTRACT_MAX_CHARS=${EXTRACT_MAX_CHARS:-4000}
      - TIMEOUT=${TIMEOUT:-600}
      - MAX_WORKERS=${MAX_WORKERS:-3}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      - MONGO_HOST=${MONGO_HOST:-mongodb}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-documents_db}

    command: python src/main.py
    # Limites de ressources pour optimisation CPU (modèle 3B plus léger)
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: "4"  # Adapté pour modèle 3B
        reservations:
          memory: 1G
          cpus: "0.5"

volumes:
  mongodb_data:
