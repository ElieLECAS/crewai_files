version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_server
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=documents_db
    restart: unless-stopped

  pdf_processor:
    build: .
    container_name: pdf_processor
    depends_on:
      - mongodb
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - MODEL=${MODEL:-gpt5.1}
      - TIMEOUT=${TIMEOUT:-600}
      - MAX_WORKERS=${MAX_WORKERS:-3}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      - MONGO_HOST=${MONGO_HOST:-mongodb}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-documents_db}

    command: python src/main.py
    # Limites de ressources pour optimisation
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
        reservations:
          memory: 1G
          cpus: "0.5"

volumes:
  mongodb_data:
