version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    volumes:
      - ollama_data:/root/.ollama
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    deploy:
      resources:
        limits:
          memory: 8G    # Prévoyez large pour Mistral 7B (Modèle + Contexte)
          cpus: "2.0"   # Donnez plus de puissance pour le calcul des tokens
        reservations:
          memory: 4G

  crewai:
    build: .
    container_name: crewai_pdf_processor
    depends_on:
      - ollama
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./src:/app/src
      - ./config:/app/config
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - PYTHONPATH=/app
      - OTEL_SDK_DISABLED=true
      - MODEL=${MODEL:-mistral:7b}

    command: python src/main.py
    # Limites de ressources pour optimisation
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2"
        reservations:
          memory: 2G
          cpus: "1"

volumes:
  ollama_data:
