version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    volumes:
      - ollama_data:/root/.ollama
    # Mode CPU uniquement (sans GPU NVIDIA pour installation légère)
    deploy:
      resources:
        limits:
          memory: 8G # Prévoyez large pour Mistral 7B (Modèle + Contexte)
          cpus: "4.0" # Donnez plus de puissance pour le calcul des tokens
        reservations:
          memory: 4G

  pdf_processor:
    build: .
    container_name: pdf_processor
    depends_on:
      - ollama
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./src:/app/src
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - PYTHONPATH=/app
      - MODEL=${MODEL:-mistral:7b}
      - TIMEOUT=${TIMEOUT:-600}
      - MAX_WORKERS=${MAX_WORKERS:-3}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}

    command: python src/main.py
    # Limites de ressources pour optimisation
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
        reservations:
          memory: 1G
          cpus: "0.5"

volumes:
  ollama_data:
