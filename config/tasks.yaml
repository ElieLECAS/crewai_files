extract_devis_data:
    description: >
        Analysez le fichier PDF de devis fourni et extrayez toutes les informations
        pour créer un fichier JSON structuré. Vous devez identifier et extraire :

        1. Le numéro de devis (format généralement DEV-XXXX ou similaire)
        2. La date d'émission (format JJ/MM/AAAA)
        3. La date de validité (format JJ/MM/AAAA)
        4. Les informations de l'entreprise :
           - Nom de l'entreprise
           - Adresse complète
        5. Toutes les prestations avec pour chacune :
           - Description détaillée
           - Quantité (nombre entier)
           - Prix unitaire HT (nombre décimal)
           - Montant HT calculé (quantité × prix unitaire)
        6. Les totaux :
           - Total HT (somme de tous les montants HT des prestations)
           - TVA (calculée, généralement 20% en France)
           - Total TTC (Total HT + TVA)
        7. Les conditions de paiement :
           - Délai de paiement (ex: "30 jours", "À réception")
           - Mode de paiement (ex: "Virement bancaire", "Chèque")
        8. Le nom du fichier source (nom du PDF original)

        Le JSON doit être valide et suivre exactement la structure fournie en exemple.
        Tous les champs numériques doivent être des nombres (pas de chaînes).
        Les dates doivent être au format JJ/MM/AAAA.

    expected_output: >
        Un objet JSON valide avec la structure suivante :
        {
          "numero_devis": "DEV-XXXX",
          "date_emission": "JJ/MM/AAAA",
          "date_validite": "JJ/MM/AAAA",
          "entreprise": {
            "nom": "Nom de l'entreprise",
            "adresse": "Adresse complète"
          },
          "prestations": [
            {
              "description": "Description de la prestation",
              "quantite": nombre,
              "prix_unitaire": nombre,
              "montant_ht": nombre
            }
          ],
          "totaux": {
            "total_ht": nombre,
            "tva": nombre,
            "total_ttc": nombre
          },
          "conditions_paiement": {
            "delai": "Délai de paiement",
            "mode": "Mode de paiement"
          },
          "fichier_source": "nom_du_fichier.pdf"
        }

        Le JSON doit être retourné uniquement, sans texte supplémentaire avant ou après.

    agent: devis_extractor
