read_pdf_and_extract_data:
    description: >
        Lisez le fichier PDF de devis fourni et extrayez toutes les informations
        pour créer un objet JSON structuré. Vous devez identifier et extraire :

        1. Le numéro de devis (format généralement DEV-XXXX ou similaire)
        2. La date d'émission (format JJ/MM/AAAA)
        3. La date de validité (format JJ/MM/AAAA)
        4. Les informations de l'entreprise :
           - Nom de l'entreprise
           - Adresse complète
        5. Toutes les prestations avec pour chacune :
           - Description détaillée
           - Quantité (nombre entier)
           - Prix unitaire HT (nombre décimal)
           - Montant HT calculé (quantité × prix unitaire)
        6. Les totaux :
           - Total HT (somme de tous les montants HT des prestations)
           - TVA (calculée, généralement 20% en France)
           - Total TTC (Total HT + TVA)
        7. Les conditions de paiement :
           - Délai de paiement (ex: "30 jours", "À réception")
           - Mode de paiement (ex: "Virement bancaire", "Chèque")
        8. Le nom du fichier source (nom du PDF original)

        PROCÉDURE :
        1. Utiliser l'outil 'read_pdf_file' avec l'argument file_path fourni.
        2. Analyser le contenu extrait et structurer les données en objet JSON (Python dict).

        Le JSON doit être valide et suivre exactement la structure fournie en exemple.
        Tous les champs numériques doivent être des nombres (pas de chaînes).
        Les dates doivent être au format JJ/MM/AAAA.

    expected_output: >
        Un objet JSON (Python dict) avec la structure suivante :
        {
          "numero_devis": "DEV-XXXX",
          "date_emission": "JJ/MM/AAAA",
          "date_validite": "JJ/MM/AAAA",
          "entreprise": {
            "nom": "Nom de l'entreprise",
            "adresse": "Adresse complète"
          },
          "prestations": [
            {
              "description": "Description de la prestation",
              "quantite": nombre,
              "prix_unitaire": nombre,
              "montant_ht": nombre
            }
          ],
          "totaux": {
            "total_ht": nombre,
            "tva": nombre,
            "total_ttc": nombre
          },
          "conditions_paiement": {
            "delai": "Délai de paiement",
            "mode": "Mode de paiement"
          },
          "fichier_source": "nom_du_fichier.pdf"
        }

        IMPORTANT : 
        - Vous devez retourner l'objet JSON complet dans votre réponse finale.
        - Ne créez PAS de fichier, juste retournez les données structurées.
        - Les données seront sauvegardées dans une tâche suivante.

    agent: devis_extractor

write_json_file:
    description: >
        ⚠️ TÂCHE CRITIQUE : Sauvegardez l'objet JSON fourni dans un fichier JSON. ⚠️

        Cette tâche est OBLIGATOIRE et ne peut pas être ignorée ou sautée.
        Vous recevrez les données extraites de la tâche précédente sous forme d'objet JSON.

        PROCÉDURE OBLIGATOIRE :
        1. Prendre l'objet JSON fourni (résultat de la tâche précédente).
        2. Vous DEVEZ ABSOLUMENT utiliser l'outil 'json_file_writer' pour sauvegarder le fichier JSON.
        3. Ne terminez JAMAIS cette tâche sans avoir appelé l'outil json_file_writer.

        L'outil json_file_writer est le SEUL moyen de créer le fichier de sortie.
        Sans cet appel, votre travail sera considéré comme incomplet et échouera.

    expected_output: >
        Un message de confirmation indiquant que le fichier JSON a été créé avec succès.
        Ce message DOIT provenir de l'outil json_file_writer.

        ⚠️ RÈGLES CRITIQUES : 
        - Vous DEVEZ OBLIGATOIREMENT utiliser l'outil json_file_writer pour créer le fichier JSON.
        - Cette étape n'est PAS optionnelle. Votre tâche n'est pas terminée tant que vous n'avez pas appelé cet outil.
        - Une fois que json_file_writer a retourné "Fichier JSON créé avec succès", 
          la tâche est terminée. Vous n'avez PAS besoin de vérifier ou de relire le fichier.
        - Ne pas utiliser d'autres outils après avoir créé le fichier avec succès.
        - Ne retournez PAS simplement un message de confirmation sans avoir appelé l'outil.

    agent: devis_extractor
